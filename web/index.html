<style>
@layer reset,base,ui;
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@layer reset{
*,::before,::after{box-sizing:border-box}
body,h1,h2,h3,p,fieldset{margin:0}
fieldset{border:0;padding:0;min-inline-size:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
}
@layer base{
:root{color-scheme:light dark;
--bg:light-dark(oklch(97.6% .008 165),oklch(18.5% .02 170));
--surf:light-dark(#fff,oklch(23.5% .025 170));
--ink:light-dark(oklch(24% .035 170),oklch(95% .01 165));
--mute:light-dark(oklch(50% .025 170),oklch(74% .02 170));
--line:color-mix(in oklab,var(--ink) 11%,transparent);
--pri:light-dark(oklch(50% .12 160),oklch(76% .15 160));
--on:light-dark(#fff,oklch(20% .04 165));
--acc:oklch(84% .16 88);
--err:light-dark(oklch(52% .19 27),oklch(76% .14 27));
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;accent-color:var(--pri)}
h1,h2,h3,.num{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;letter-spacing:-.02em;text-wrap:balance}
.mute,small{color:var(--mute)}
.i{inline-size:1.3em;block-size:1.3em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid color-mix(in oklab,var(--pri) 70%,transparent);outline-offset:2px}
}
@layer ui{
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-block-size:100dvh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;block-size:100dvh;padding:24px 16px;display:flex;flex-direction:column;gap:28px;border-inline-end:1px solid var(--line);background:var(--surf)}
.brand{display:flex;align-items:center;gap:10px;font:800 22px "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em}
.mark{display:grid;place-items:center;inline-size:34px;block-size:34px;border-radius:11px;background:var(--pri);color:var(--on);font-size:20px}
#nav{display:grid;gap:4px}
#nav button,#bnav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-weight:500;color:var(--mute);transition:background .2s,color .2s}
#nav button:hover{background:color-mix(in oklab,var(--pri) 8%,transparent);color:var(--ink)}
#nav button[aria-current=page]{background:color-mix(in oklab,var(--pri) 14%,transparent);color:var(--pri);font-weight:600}
.fine{margin-block-start:auto;font-size:12px;color:var(--mute)}
main{container:m/inline-size;padding:clamp(16px,3vw,36px);max-inline-size:1100px;inline-size:100%;margin-inline:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-block-end:22px}
.top h1{font-size:clamp(24px,4cqi,34px);line-height:1.1}
.icon-btn{display:grid;place-items:center;inline-size:42px;block-size:42px;border-radius:50%;border:1px solid var(--line);background:var(--surf)}
.grid{display:grid;gap:18px;grid-template-areas:"wallet" "work" "stats"}
@container m (min-width:760px){.grid{grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);grid-template-areas:"work wallet" "work stats";grid-template-rows:auto 1fr;align-items:start}}
.wcard{grid-area:wallet}#work{grid-area:work}#stats{grid-area:stats}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3cqi,26px);box-shadow:0 1px 0 var(--line),0 24px 40px -28px color-mix(in oklab,var(--pri) 45%,transparent)}
.ph{display:flex;gap:14px;align-items:center;margin-block-end:20px}
.ph h2{font-size:22px}.ph p{color:var(--mute);font-size:14px}
.ic{display:grid;place-items:center;inline-size:44px;block-size:44px;border-radius:14px;background:color-mix(in oklab,var(--pri) 13%,transparent);color:var(--pri);flex:none}
fieldset{margin-block-end:18px}
legend,.fld label{font-size:13px;font-weight:600;color:var(--mute);margin-block-end:8px;padding:0;display:block}
.nets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-weight:500;transition:border-color .15s,background .15s,transform .15s}
.opt input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.opt:hover{border-color:color-mix(in oklab,var(--pri) 45%,var(--line))}
.opt:has(:checked){border-color:var(--pri);background:color-mix(in oklab,var(--pri) 10%,var(--surf));box-shadow:0 0 0 3px color-mix(in oklab,var(--pri) 16%,transparent)}
.opt:has(:focus-visible){outline:3px solid color-mix(in oklab,var(--pri) 70%,transparent);outline-offset:2px}
.opt.pill{border-radius:999px;padding:8px 16px}
.logo{display:grid;place-items:center;inline-size:26px;block-size:26px;border-radius:8px;background:var(--bg);color:var(--fg);font:800 13px "Bricolage Grotesque",sans-serif;flex:none}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.plan{flex-direction:column;align-items:flex-start;gap:2px}
.plan b{font:700 18px "Bricolage Grotesque",sans-serif}
.plan small{font-size:12px}.plan em{font-style:normal;font-weight:600;color:var(--pri);margin-block-start:4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.fld{margin-block-end:18px}
.fld input,.fld select{inline-size:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;transition:border-color .15s,box-shadow .15s}
.fld input:focus,.fld select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in oklab,var(--pri) 18%,transparent)}
.fld input:user-invalid{border-color:var(--err)}
.sm{margin-block-start:8px}
.pill{font-size:13px}
button.pill:not(.opt){padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:600;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.pri{inline-size:100%;background:var(--pri);color:var(--on);font-size:16px}
.btn.pri:hover{filter:brightness(1.07)}
.btn.acc{background:var(--acc);color:oklch(25% .05 85)}
.btn.ghost{inline-size:100%;border:1px solid var(--line);margin-block-start:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.err{color:var(--err);font-size:14px;min-block-size:1.5em;margin-block-end:8px}
.wcard{position:relative;isolation:isolate;border-radius:26px;padding:22px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,oklch(52% .13 160/.55),transparent 60%),radial-gradient(80% 70% at 0% 100%,oklch(62% .15 95/.28),transparent 60%),linear-gradient(150deg,oklch(35% .08 165),oklch(22% .05 175));display:grid;gap:6px}
.wcard::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--a),transparent 55%,var(--acc),transparent 95%);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;-webkit-mask-composite:xor;animation:spin 7s linear infinite;pointer-events:none}
@keyframes spin{to{--a:360deg}}
.r1{display:flex;justify-content:space-between;font-size:13px;opacity:.85}
.lab{margin-block-start:18px;font-size:13px;opacity:.75}
.big{font-size:clamp(34px,8cqi,46px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.acts{display:flex;gap:10px;align-items:center;margin-block-start:14px}
.acts .icon-btn{background:#fff2;border-color:#fff3;color:#fff}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-block-end:14px}
.sh h3{font-size:17px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;block-size:110px;align-items:end}
.bar{display:grid;gap:6px;justify-items:center;block-size:100%;grid-template-rows:1fr auto;font-size:11px;color:var(--mute)}.bar i{align-self:end}
.bar i{display:block;inline-size:100%;block-size:var(--h);min-block-size:4px;border-radius:8px 8px 4px 4px;background:color-mix(in oklab,var(--pri) 35%,transparent);transition:block-size .6s cubic-bezier(.2,.8,.2,1)}
@starting-style{.bar i{block-size:4px}}
.bar.now i{background:var(--pri)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block-end:16px}
.kpi{padding:12px;border-radius:14px;background:var(--bg)}
.kpi b{display:block;font:700 20px "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.tx{display:flex;align-items:center;gap:12px;inline-size:100%;text-align:start;padding:12px 8px;margin-inline:-8px;border-radius:14px;transition:background .15s}
.tx:hover{background:var(--bg)}
.tx .t{flex:1;min-inline-size:0}.tx b{display:block;font-weight:600}.tx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;font-variant-numeric:tabular-nums}
.empty{color:var(--mute);padding:20px 0;text-align:center}
.bottom{display:none}
dialog{border:0;padding:0;background:var(--surf);color:var(--ink);inline-size:min(100%,440px);max-inline-size:100%;margin:auto auto 0;border-radius:26px 26px 0 0;box-shadow:0 -20px 60px -20px #0008;opacity:0;translate:0 40px;transition:opacity .25s,translate .3s cubic-bezier(.2,.8,.2,1),overlay .25s allow-discrete,display .25s allow-discrete}
dialog[open]{opacity:1;translate:0 0}
@starting-style{dialog[open]{opacity:0;translate:0 40px}}
dialog::backdrop{background:oklch(15% .03 170/.5);backdrop-filter:blur(6px)}
.sheet{padding:24px 22px calc(22px + env(safe-area-inset-bottom,0px));max-block-size:88dvh;overflow:auto}
.sheet h3{font-size:22px;margin-block-end:12px}
.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-block-end:1px dashed var(--line);font-size:14px}
.row span:first-child{color:var(--mute)}.row span:last-child{font-weight:600;text-align:end;word-break:break-word}
.pin{display:flex;gap:10px;justify-content:center;margin-block:18px 10px}
.pin input{inline-size:58px;block-size:66px;text-align:center;font-size:26px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg)}
.pin input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in oklab,var(--pri) 18%,transparent)}
.center{text-align:center}
.spin{inline-size:46px;aspect-ratio:1;border-radius:50%;border:4px solid var(--line);border-top-color:var(--pri);animation:rot .8s linear infinite;margin:26px auto}
@keyframes rot{to{rotate:1turn}}
.tick{inline-size:68px;display:block;margin:0 auto 12px;fill:none;stroke:var(--pri);stroke-width:3;stroke-linecap:round}
.tick circle{stroke-dasharray:151;stroke-dashoffset:151;animation:draw .6s forwards}
.tick path{stroke-dasharray:50;stroke-dashoffset:50;animation:draw .4s .45s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.token{font:800 22px "Bricolage Grotesque",sans-serif;letter-spacing:.05em;text-align:center;background:var(--bg);border-radius:14px;padding:14px;margin-block:14px;word-break:break-all;font-variant-numeric:tabular-nums}
@media (max-width:860px){
.shell{grid-template-columns:minmax(0,1fr)}.side{display:none}
main{padding-block-end:96px}
.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset-inline:0;bottom:0;z-index:5;background:color-mix(in oklab,var(--surf) 84%,transparent);backdrop-filter:blur(16px) saturate(1.5);border-block-start:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#bnav button{flex-direction:column;gap:2px;font-size:11px;padding:8px 2px}
#bnav button[aria-current=page]{color:var(--pri);font-weight:600}
}
@media (min-width:600px){dialog{margin:auto;border-radius:26px}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}.tick circle,.tick path{stroke-dashoffset:0}}
}
[hidden]{display:none!important}
.banner{margin:0 0 16px;padding:10px 14px;border-radius:14px;font-size:13px;background:color-mix(in oklab,var(--acc) 22%,var(--surf));border:1px solid color-mix(in oklab,var(--acc) 50%,transparent)}
#auth{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:var(--bg);overflow:auto}
.authcard{inline-size:min(100%,420px)}
.authcard .brand{margin-block-end:14px}
.authcard h2{font-size:24px;margin-block-end:14px}
.authcard fieldset legend:empty{display:none}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--mute)}
.brand{gap:10px}.brand .wm{color:var(--ink);flex:none}.brand .lg{flex:none;filter:drop-shadow(0 5px 10px color-mix(in oklab,var(--pri) 35%,transparent))}
.mbrand{display:none;margin-block-end:12px}
.svcs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.svc{display:grid;justify-items:center;gap:10px;padding:16px 8px;border:1px solid var(--line);border-radius:18px;background:var(--bg);font-weight:600;font-size:13px;transition:transform .15s,border-color .15s,box-shadow .15s}
.svc:hover{transform:translateY(-2px);border-color:color-mix(in oklab,var(--pri) 40%,var(--line));box-shadow:0 12px 24px -14px color-mix(in oklab,var(--pri) 60%,transparent)}
.svc .ic{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 8px 16px -8px var(--g2)}
.dot{display:inline-block;inline-size:9px;block-size:9px;border-radius:50%;margin-inline-end:8px}.dot.ok{background:var(--pri)}.dot.warn{background:var(--acc)}
.status{margin:16px 2px 0;font-size:13px;color:var(--mute)}
.tbl{overflow-x:auto;margin-block-end:8px}.tbl table{inline-size:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}.tbl th,.tbl td{padding:9px 8px;text-align:start;border-block-end:1px solid var(--line);white-space:nowrap}.tbl th{font-size:12px;color:var(--mute);font-weight:600}
.sub{font-size:16px;margin:20px 0 8px}
.av{display:grid;place-items:center;inline-size:52px;block-size:52px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--acc));color:var(--on);font:800 22px "Bricolage Grotesque",sans-serif;flex:none}
.icon-btn{position:relative}#belldot{position:absolute;inset:9px 10px auto auto;inline-size:9px;block-size:9px;border-radius:50%;background:var(--err);border:2px solid var(--surf)}
#bnav .fabc{display:grid;place-items:center;inline-size:54px;block-size:54px;border-radius:50%;margin-block-start:-30px;background:linear-gradient(135deg,var(--pri),oklch(70% .14 130));color:var(--on);border:4px solid var(--bg);box-shadow:0 10px 22px -8px color-mix(in oklab,var(--pri) 70%,transparent)}
#bnav .fab{color:var(--pri);font-weight:600}
@media (max-width:860px){.mbrand{display:flex}.top h1{font-size:22px}.top .icon-btn{inline-size:38px;block-size:38px}.top>div:last-child{gap:6px!important}}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(90% 60% at 50% 32%,oklch(50% .11 165/.55),transparent 70%),linear-gradient(160deg,#0B6B4C,#032F23 72%);color:#fff;text-align:center;transition:opacity .5s,visibility .5s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
#splash .lg{filter:drop-shadow(0 16px 40px #0009);animation:sp-in 1s cubic-bezier(.2,.8,.2,1) both}
#splash .wm{color:#fff;margin-block-start:18px;animation:sp-in 1s .3s both}
#splash p{margin:12px 0 0;font-size:15px;letter-spacing:.03em;animation:sp-in .9s .7s both}#splash p b{color:#FCD34D}
#splash .bar{inline-size:56px;block-size:3px;border-radius:9px;background:#fff3;overflow:hidden;margin-block-start:28px;animation:sp-in .6s 1s both}
#splash .bar::after{content:"";display:block;block-size:100%;inline-size:40%;background:linear-gradient(90deg,#FCD34D,#fff);border-radius:inherit;animation:sp-bar 1.2s ease-in-out infinite}
@keyframes sp-in{from{opacity:0;transform:translateY(12px) scale(.94)}}
@keyframes sp-bar{from{translate:-100%}to{translate:260%}}

const COMMON=["password","password1","password123","12345678","123456789","1234567890","qwerty123","qwertyuiop","iloveyou","admin123","welcome1","welcome123","abc12345","11111111","00000000","letmein123","passw0rd","nigeria123","naija123","vendly123","football1","monkey123","dragon123"];
function pwChecks(pw,name,phone){
  const l=pw.toLowerCase(),n=String(name||"").toLowerCase().split(/\s+/).filter(w=>w.length>=3),p=String(phone||"");
  const own=n.some(w=>l.includes(w))||(p.length>=7&&(l.includes(p)||l.includes(p.slice(-7))));
  return [["At least 8 characters",pw.length>=8],["Upper and lower case letters",/[a-z]/.test(pw)&&/[A-Z]/.test(pw)],["At least one number",/\d/.test(pw)],["Not a common password",!!pw&&!COMMON.includes(l)],["Doesn’t contain your name or number",!!pw&&!own]];
}
const pwMsg=["Password must be at least 8 characters.","Use both upper and lower case letters in your password.","Add at least one number to your password.","That password is too common. Choose another.","Your password can’t contain your name or phone number."];
const pwProblem=(pw,name,phone)=>{const c=pwChecks(pw,name,phone).findIndex(x=>!x[1]);return c<0?null:pwMsg[c]};
function pinProblem(pin){
  if(!/^\d{4}$/.test(pin))return "PIN must be 4 digits.";
  const d=[...pin].map(Number);
  if(d.every(x=>x===d[0])||d.every((x,i)=>!i||x===d[i-1]+1)||d.every((x,i)=>!i||x===d[i-1]-1)||["1212","2121","1122","6969","1004","2000","2580","1357","2468"].includes(pin))return "Choose a PIN that isn’t easy to guess (not 1234, 1111 or similar).";
  return null;
}
function makeMock(store){
  let d=JSON.parse(store.get("vendly_demo")||"null")||{u:null,on:0,bal:0,tx:[],fails:0,lock:0};

  const E=(status,m)=>{throw Object.assign(new Error(m),{status})};
  const pu=()=>({id:1,name:d.u.name,phone:d.u.phone,since:d.u.since});
  const pt=t=>{const{req,...r}=t;return r};
  const need=()=>{if(!d.u||!d.on)E(401,"Please log in again.")};
  const pinCheck=pin=>{
    if(d.lock>Date.now())E(423,"PIN locked. Try again in a few minutes.");
    if(pin!==d.u.pin){
      d.fails++;
      if(d.fails>=5){d.fails=0;d.lock=Date.now()+9e5;save();E(423,"Too many wrong PINs. Locked for 15 minutes.")}

  return async(method,path,b={})=>{
    await new Promise(r=>setTimeout(r,250));

      const name=String(b.name||"").trim();
      if(name.length<2)E(400,"Enter your name.");
      if(!/^0\d{10}$/.test(b.phone||""))E(400,"Enter a valid 11-digit phone number.");
      const pw=pwProblem(String(b.password||""),name,b.phone);if(pw)E(400,pw);
      const pp=pinProblem(String(b.pin||""));if(pp)E(400,pp);
      if(b.agreed!==true)E(400,"Please accept the Terms and Privacy Policy.");
      d={u:{name,phone:b.phone,password:b.password,pin:b.pin,since:Date.now()},on:1,bal:0,tx:[],fails:0,lock:0};save();
      return{token:"demo",user:pu(),balance:0};
    }
    if(k==="POST /api/login"){
      if(!d.u||d.u.phone!==b.phone||d.u.password!==b.password)E(401,"Wrong phone number or password. (Demo: create an account first.)");
      d.on=1;save();return{token:"demo",user:pu(),balance:d.bal};
    }
    if(k==="POST /api/logout"){d.on=0;save();return{}}
    need();
    if(k==="GET /api/me")return{user:pu(),balance:d.bal};
    if(k==="GET /api/transactions")return{transactions:d.tx.map(pt)};
    if(k==="POST /api/password"){
      if(b.current!==d.u.password)E(403,"Your current password is wrong.");
      const pw=pwProblem(String(b.next||""),d.u.name,d.u.phone);if(pw)E(400,pw);
      d.u.password=b.next;save();return{token:"demo"};

function notif(){
  ls.set("vendly_seen","1");$("#belldot").hidden=true;
  show(`<h3>Notifications</h3>${NOTICES.map(n=>`<div class="row" style="display:block"><b>${esc(n[0])}</b><p class="mute" style="margin:2px 0 0">${esc(n[1])}</p></div>`).join("")}<div style="margin-block-start:16px"><button class="btn pri" data-close>Close</button></div>`);
}
/* Short plain-language summaries. Replace with your final Terms and Privacy Policy before going live. */
function legal(k){
  const T={terms:["Terms of use (summary)",["Use Vendly only for your own lawful purchases.","Keep your PIN and password private. You are responsible for activity that uses them.","A purchase sent to a wrong number or meter can’t be reversed once delivered, so check the details before you confirm.","If a purchase fails, the money goes back to your wallet.","We may pause accounts that look suspicious, to protect other users."]],privacy:["Privacy policy (summary)",["We collect your name, phone number and purchase history.","We use them to run your account, deliver your purchases and prevent fraud.","We don’t sell your information.","Your password and PIN are stored scrambled, so nobody at Vendly can read them."]]};
  const[t,l]=T[k];
  show(`<h3>${t}</h3><ul class="plain">${l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p class="mute" style="font-size:13px;margin-block-end:14px">This is a short summary. The full document will be published before Vendly opens to the public.</p><button class="btn pri" data-close>Close</button>`);
}
function forgotDlg(){
  show(`<h3>Forgot your password?</h3><p class="mute" style="margin-block-end:16px">Resetting with a verification code isn’t available yet. For now, contact support with your phone number and they will help you.</p>${SUPPORT_WA?`<a class="btn pri" href="https://wa.me/${esc(SUPPORT_WA)}" target="_blank" rel="noopener">Chat on WhatsApp</a>`:'<p class="mute">The support line will be added before launch.</p>'}<button class="btn ghost" data-close>Close</button>`);
}
/* Unified codes first, older network codes second. Networks change codes sometimes. */
const BAL={MTN:{a:["*310#","*556#"],d:["*323#","*131*4#"]},Airtel:{a:["*310#","*123#"],d:["*323#","*140#"]},Glo:{a:["*310#","*124#"],d:["*323#","*127*0#"]},"9mobile":{a:["*310#","*232#"],d:["*323#","*228#"]}};
const tel=c=>"tel:"+c.replace(/#/g,"%23");
function balDialog(){
  const n=F.net,c=BAL[n],link=(x,alt)=>`<a class="codea${alt?" alt":""}" href="${tel(x)}">${esc(x)}</a>`;
  show(`<h3>Check your balance</h3><p class="mute" style="margin-block-end:14px">Pick your network, then tap a code. Your phone’s dialer opens. Press call to see your balance.</p>${fs("Network",Object.keys(NETS).map(x=>opt("bnet",x,badge(x)+x,x===n)).join(""),"nets")}<div class="row"><span>Airtime</span><span class="codes">${link(c.a[0])}${link(c.a[1],1)}</span></div><div class="row"><span>Data</span><span class="codes">${link(c.d[0])}${link(c.d[1],1)}</span></div><p class="mute" style="font-size:13px;margin:12px 0 14px">If the first code doesn’t work, try the second, or open your network’s app.</p><button class="btn ghost" data-close>Close</button>`);
}
function lastUpText(){
  if(F.phone.length!==11)return "";
  const t=S.tx.find(x=>x.detail===F.phone&&x.status==="success"&&(x.kind==="airtime"||x.kind==="data"));
  return t?`Last topped up: ${t.title} (${fmt(t.amount)}) on ${new Date(t.created_at).toLocaleDateString("en-NG",{day:"numeric",month:"short"})}.`:"";
}

const lastUser=()=>{try{return JSON.parse(ls.get("vendly_last")||"null")}catch{return null}};
const hero=(s=72)=>`<div class="hero"><svg class="lg" width="${s}" height="${s}" aria-hidden="true"><use href="#logo"/></svg><svg class="wm" width="${Math.round(s*1.9)}" height="${Math.round(s*.75)}" aria-label="Vendly"><use href="#wm"/></svg></div>`;
const trustline=()=>`<p class="trustline">${ico("shield")}<span>Your password and PIN are stored scrambled. We never ask for them.</span></p>`;
const STEPS=["Details","Password","PIN","Review"];
const pinGroup=(g,label,val)=>`<div class="fld"><label>${label}</label><div class="pin pin-sm" role="group" aria-label="${label}">${[0,1,2,3].map(i=>`<input type="password" inputmode="numeric" maxlength="1" autocomplete="off" data-pg="${g}" data-i="${i}" value="${esc(val[i]||"")}" aria-label="${label}, digit ${i+1}">`).join("")}</div></div>`;
function strength(){
  const c=pwChecks(AF.password,AF.name,AF.phone),n=c.filter(x=>x[1]).length;
  if(!AF.password)return{lvl:0,label:""};
  return n===5?(AF.password.length>=12?{lvl:4,label:"Strong"}:{lvl:3,label:"Good"}):n>=3?{lvl:2,label:"Fair"}:{lvl:1,label:"Weak"};
}
function pwUI(){
  const c=pwChecks(AF.password,AF.name,AF.phone),s=strength(),m=$("#meter");
  if(m){m.dataset.s=s.lvl;$("#mlabel").textContent=s.label}
  $$(".chk li").forEach((li,i)=>li.classList.toggle("ok",c[i][1]));
}
function regHTML(){
  const bar=`<div class="steps" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="${AS}" aria-label="Step ${AS} of 4">${STEPS.map((n,i)=>`<div class="stp${i+1<AS?" done":i+1===AS?" now":""}"><i></i><span>${n}</span></div>`).join("")}</div>`;
  let b="";
  if(AS===1)b=`<h2>Create your account</h2><p class="mute lead">Use your real details. They help protect your wallet.</p>${fld("a-name","Full name","Your name",AF.name,60,"text","text")}${fld("a-phone","Phone number","0803 000 0000",AF.phone,11)}`;
  if(AS===2)b=`<h2>Choose a strong password</h2><p class="mute lead">It keeps your account safe even if someone knows your phone number.</p>${fld("a-password","Password","Create a password",AF.password,60,"password","text")}<div class="meter" id="meter" data-s="0"><i></i><i></i><i></i><i></i></div><p class="mlabel" id="mlabel"></p><ul class="chk">${pwChecks("","","").map(x=>`<li>${x[0]}</li>`).join("")}</ul>${fld("a-password2","Confirm password","Type it again",AF.password2,60,"password","text")}`;
  if(AS===3)b=`<h2>Create your PIN</h2><p class="mute lead">Your 4-digit PIN confirms every purchase. Avoid birthdays and easy numbers like 1234.</p>${pinGroup("pin","Create PIN",AF.pin)}${pinGroup("pin2","Confirm PIN",AF.pin2)}`;
  if(AS===4)b=`<h2>Review and confirm</h2>${rows([["Name",AF.name.trim()],["Phone",AF.phone],["Password",strength().label||"Set"],["PIN","Set ✓"]])}<label class="agree"><input type="checkbox" id="a-agree"${AF.agree?" checked":""}><span>I agree to the <button type="button" class="linkbtn" data-act="terms">Terms of use</button> and <button type="button" class="linkbtn" data-act="privacy">Privacy policy</button>.</span></label><div class="protect"><b>How we protect you</b><ul><li>Your password and PIN are stored scrambled, so nobody can read them.</li><li>Your PIN is needed for every purchase.</li><li>Purchases lock after 5 wrong PIN tries.</li><li>We will never ask for your PIN or password.</li></ul></div>`;
  const next=AS===4?'<button class="btn pri" id="asub" data-act="next">Create account</button>':'<button class="btn pri" data-act="next">Continue</button>';
  return `<button class="linkbtn toplink" data-am="${lastUser()?"back":"login"}">‹ Back to log in</button>${hero(52)}${bar}${b}<p class="err" id="aerr" role="alert"></p>${next}${AS>1?'<button class="btn ghost" data-act="back">Back</button>':""}${trustline()}`;
}
function authHTML(){
  const last=lastUser(),back=AM==="back"&&last,reg=AM==="register";
  let h;
  if(reg)h=regHTML();
  else if(back){AF.phone=last.phone;h=`${hero(76)}<h2 class="ctr">Welcome back, ${esc(String(last.name).split(" ")[0])}</h2><p class="mute ctr" style="margin:-4px 0 6px">Enter your password to continue.</p><div class="ctr" style="margin-block-end:12px"><button class="linkbtn" data-am="login">Log in with another account</button></div>${fld("a-password","Password","Your password",AF.password,60,"password","text")}<p class="err" id="aerr" role="alert"></p><button class="btn pri" id="asub">Log in</button><button class="btn ghost" data-act="forgot">Forgot password?</button><button class="btn ghost" data-am="register">New here? Create account</button>${trustline()}`}
  else h=`${hero(76)}<h2 class="ctr">Welcome to Vendly</h2><p class="mute ctr" style="margin:-4px 0 14px">Log in to your account.</p>${fld("a-phone","Phone number","0803 000 0000",AF.phone,11)}${fld("a-password","Password","Your password",AF.password,60,"password","text")}<p class="err" id="aerr" role="alert"></p><button class="btn pri" id="asub">Log in</button><button class="btn ghost" data-act="forgot">Forgot password?</button><button class="btn ghost" data-am="register">New here? Create account</button>${trustline()}`;
  $("#auth").innerHTML=`<div class="panel authcard">${h}</div>`;
  if(reg&&AS===2)pwUI();
}
function showAuth(){AM=lastUser()?"back":"login";AS=1;$("#shell").hidden=true;$("#bnav").hidden=true;$("#auth").hidden=false;authHTML()}
function wizNext(){
  const err=m=>{$("#aerr").textContent=m};
  if(AS===1){
    if(AF.name.trim().length<2)return err("Enter your full name.");
    if(!/^0\d{10}$/.test(AF.phone))return err("Enter a valid 11-digit phone number.");
    AS=2;return authHTML();
  }
  if(AS===2){
    const c=pwChecks(AF.password,AF.name,AF.phone).find(x=>!x[1]);
    if(c)return err("Password rule not met: "+c[0].toLowerCase()+".");
    if(AF.password!==AF.password2)return err("The two passwords don’t match.");
    AS=3;return authHTML();
  }
  if(AS===3){
    const p=pinProblem(AF.pin);if(p)return err(p);
    if(AF.pin!==AF.pin2)return err("The two PINs don’t match.");
    AS=4;return authHTML();
  }
  if(!AF.agree)return err("Please accept the Terms and Privacy policy to continue.");
  submitAuth();
}
const wizBack=()=>{AS=Math.max(1,AS-1);authHTML()};
function openDrawer(){
  const u=S.user||{name:""},item=([k,n,i])=>`<button class="di" data-view="${k}" aria-current="${F.view===k?"page":"false"}">${ico(i)}<span>${n}</span></button>`;
  $("#drawer .dpanel").innerHTML=`<div class="dtop"><div><b>${esc(u.name)}</b><small>Balance: ${fmt(S.bal)}</small></div><button class="icon-btn" data-act="drawer-close" aria-label="Close menu"><svg class="i" style="rotate:45deg"><use href="#plus"/></svg></button></div>${NAV.map(item).join("")}<hr>${canInstall()?`<button class="di" data-act="install">${ico("plus")}<span>Install app</span></button>`:""}<button class="di" data-act="notif">${ico("bell")}<span>Notifications</span></button><button class="di" data-act="support">${ico("headset")}<span>Support</span></button><button class="di" data-act="logout" style="color:var(--err)">${ico("out")}<span>Log out</span></button>`;
  $("#drawer").classList.add("open");
}
const closeDrawer=()=>$("#drawer").classList.remove("open");
let DEFER=null,READY=false;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const dismissed=()=>Date.now()-Number(ls.get("vendly_install_no")||0)<7*864e5;
const canInstall=()=>!DEMO&&!standalone()&&(!!DEFER||isIOS());
function offerInstall(force){
  if(!canInstall()||(!force&&dismissed()))return;
  const el=$("#install"),ios=!DEFER,nav=$("#bnav"),lift=nav&&!nav.hidden&&getComputedStyle(nav).display!=="none";
  el.style.setProperty("--ib",lift?"92px":"14px");
  el.innerHTML=`<div class="ins-top"><svg class="lg" width="52" height="52" aria-hidden="true"><use href="#logo"/></svg><div><b>Install Vendly</b><p>${ios?"Add Vendly to your home screen. It opens like an app, with one tap.":"Get the Vendly app icon on your home screen. It opens full-screen like a real app."}</p></div></div>${ios?`<div class="ins-steps">Tap ${ico("share")} <b>Share</b>, then <b>Add to Home Screen</b>.</div>`:""}<div class="ins-btns">${ios?"":'<button class="btn pri" id="ins-go">Install</button>'}<button class="btn ghost" id="ins-no">${ios?"Got it":"Not now"}</button></div>`;
  el.hidden=false;
  $("#ins-no").onclick=()=>{ls.set("vendly_install_no",String(Date.now()));el.hidden=true};
  const go=$("#ins-go");
  if(go)go.onclick=async()=>{
    el.hidden=true;
    try{DEFER.prompt();const r=await DEFER.userChoice;if(r.outcome!=="accepted")ls.set("vendly_install_no",String(Date.now()))}catch{}
    DEFER=null;
  };
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEFER=e;if(READY)setTimeout(offerInstall,600)});
window.addEventListener("appinstalled",()=>{DEFER=null;$("#install").hidden=true});
function start(){$("#auth").hidden=true;$("#shell").hidden=false;$("#bnav").hidden=false;render()}
async function loadTx(){S.tx=(await api("GET","/api/transactions")).transactions}
async function submitAuth(){
  const err=m=>{const e=$("#aerr");if(e)e.textContent=m},reg=AM==="register";
  if(!reg){
    if(!/^0\d{10}$/.test(AF.phone))return err("Enter a valid 11-digit phone number.");
    if(!AF.password)return err("Enter your password.");
  }
  const b=$("#asub");b.disabled=true;b.textContent="Please wait…";
  try{
    const r=await api("POST",reg?"/api/register":"/api/login",reg?{name:AF.name.trim(),phone:AF.phone,password:AF.password,pin:AF.pin,agreed:true}:{phone:AF.phone,password:AF.password});
    TOK=r.token;if(!DEMO)ls.set("vendly_token",TOK);
    S.user=r.user;S.bal=r.balance;ls.set("vendly_last",JSON.stringify({name:r.user.name,phone:r.user.phone}));F.view="home";
    AF.password=AF.password2=AF.pin=AF.pin2="";AF.agree=false;AS=1;
    await loadTx();start();
  }catch(e){err(e.message);b.disabled=false;b.textContent=reg?"Create account":"Log in"}
}
function logout(){
  TOK=null;ls.del("vendly_token");if(DEMO)mock("POST","/api/logout").catch(()=>{});
  S.user=null;S.bal=0;S.tx=[];AF.password=AF.password2=AF.pin=AF.pin2="";AF.agree=false;closeDrawer();dlg.open&&dlg.close();showAuth();
}

$("#nav").innerHTML=NAV.map(([k,n,i])=>`<button data-view="${k}">${ico(i)}<span>${n}</span></button>`).join("");
$("#bnav").innerHTML=`<button data-view="home">${ico("home")}<span>Home</span></button><button data-view="history">${ico("clock")}<span>History</span></button><button class="fab" data-act="fund" aria-label="Fund wallet"><span class="fabc">${ico("plus")}</span><span>Fund</span></button><button data-view="prices">${ico("tag")}<span>Prices</span></button><button data-view="profile">${ico("user")}<span>Profile</span></button>`;
function go(v){closeDrawer();const f=()=>{F.view=v;render()};document.startViewTransition?document.startViewTransition(f):f()}

document.addEventListener("click",e=>{
  const g=s=>e.target.closest(s);let el;
  if(el=g("[data-view]"))return go(el.dataset.view);
  if(el=g("[data-act]")){const A={fund,install:()=>offerInstall(true),support,notif,logout,bal:balDialog,forgot:forgotDlg,terms:()=>legal("terms"),privacy:()=>legal("privacy"),drawer:openDrawer,"drawer-close":closeDrawer,next:wizNext,back:wizBack};closeDrawer();return(A[el.dataset.act]||(()=>0))()}
  if(el=g("[data-eye]")){const i=$("#"+el.dataset.eye);i.type=i.type==="password"?"text":"password";return}
  if(g("#chpw"))return chPw();
  if(g("#chpin"))return chPin();
  if(el=g("[data-am]")){AM=el.dataset.am;AS=1;return authHTML()}
  if(el=g("[data-tx]"))return receipt(S.tx.find(t=>t.ref===el.dataset.tx));
  if(el=g("[data-f]")){$("#famt").value=el.dataset.f;return}
  if(g("[data-close]"))return dlg.close();
  if(g("#gofund")||g("#fund"))return fund();
  if(g("#hidebal")){HIDE=!HIDE;return render()}
  if(g("#logout"))return logout();
  if(g("#asub"))return submitAuth();
  if(g("#theme")){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark";return}
  if(g("#review")){const o=build();if(o.error)return $("#err").textContent=o.error;review(o)}
  if(e.target===dlg)dlg.close();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.type==="radio"){
    if(t.name==="bnet"){F.net=t.value;render();return balDialog()}
    if(t.name==="am"){AM=t.value;return authHTML()}
    F[t.name]=["plan","pkg"].includes(t.name)?+t.value:t.value;
    if(t.name==="cable")F.pkg=0;
    render();
  }
  if(t.id==="disco")F.disco=t.value;
  if(t.id==="a-agree")AF.agree=t.checked;
});
document.addEventListener("input",e=>{
  const t=e.target,id=t.id,v=t.value.replace(/\D/g,"");
  const ae=$("#aerr");if(ae&&t.closest&&t.closest("#auth"))ae.textContent="";
  if(t.dataset.pg){
    t.value=v.slice(-1);const g=$$(`[data-pg="${t.dataset.pg}"]`);AF[t.dataset.pg]=g.map(x=>x.value).join("");
    if(t.value&&g[+t.dataset.i+1])g[+t.dataset.i+1].focus();return;
  }
  if(id==="phone"||id==="a-phone"){
    const k=id==="phone"?F:AF;k.phone=v;t.value=v;
    if(id==="phone"){const lu=$("#lastup");if(lu)lu.textContent=lastUpText()}
    const n=id==="phone"&&detectNet(v);
    if(n&&n!==F.net){F.net=n;$$("input[name=net]").forEach(r=>r.checked=r.value===n);$$(".plan em[data-i]").forEach(m=>m.textContent=fmt(price(+m.dataset.i)))}
  }
  else if(id==="amt"){F.amount=v;t.value=v;$$("input[name=amount]").forEach(r=>r.checked=r.value===v)}
  else if(id==="meter"){F.meter=v;t.value=v}
  else if(id==="card"){F.card=v;t.value=v}
  else if(id==="famt")t.value=v;
  else if(id==="q"){F.q=t.value;$("#txlist").innerHTML=txRows()}
  else if(id==="a-pin"){AF.pin=v;t.value=v}
  else if(id==="a-name")AF.name=t.value;
  else if(id==="a-password"){AF.password=t.value;if(AM==="register")pwUI()}
  else if(id==="a-password2")AF.password2=t.value;
  else if(id==="cpin-cur"||id==="cpin-new")t.value=v;
});
document.addEventListener("focusin",e=>{const t=e.target;if(t.dataset&&t.dataset.pg)t.select()});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(e.key==="Escape")closeDrawer();
  if(e.key==="Backspace"&&t.dataset&&t.dataset.pg&&!t.value){const g=$$(`[data-pg="${t.dataset.pg}"]`);g[+t.dataset.i-1]?.focus()}
  if(e.key==="Enter"&&t.closest&&t.closest("#auth")&&t.tagName==="INPUT"&&t.type!=="checkbox"){e.preventDefault();AM==="register"?wizNext():submitAuth()}
});

(async()=>{
  const splash=$("#splash"),quick=matchMedia("(prefers-reduced-motion:reduce)").matches;
  let skip;const minWait=new Promise(r=>{skip=r;setTimeout(r,quick?600:2300)});
  splash.addEventListener("click",()=>skip());
  await detect();
  if(!DEMO&&"serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
  const b=$("#banner");
  b.hidden=!DEMO&&MODE==="live";
  b.textContent=DEMO?"Demo mode: this preview isn’t connected to a server, so nothing here is real.":"Sandbox mode: test money only. No real airtime is sent.";
  $("#date").textContent=new Date().toLocaleDateString("en-NG",{weekday:"long",day:"numeric",month:"long"});
  let ok=false;
  try{if(TOK||DEMO){const me=await api("GET","/api/me");S.user=me.user;S.bal=me.balance;await loadTx();start();ok=true}}catch{}
  if(!ok)showAuth();
  await minWait;
  splash.classList.add("out");setTimeout(()=>{splash.hidden=true},600);
  READY=true;setTimeout(offerInstall,1400);
})();
</script>
</body>
</html>
